[project]
name = "yesterdays-clip"
version = "0.1.0"
description = "Image/text embedding microservice: OpenVINO inference over HTTP for semantic search."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    # open_clip runs every query through ftfy.fix_text (uncurls quotes,
    # normalizes widths/ligatures) before BPE; token parity needs the same.
    "ftfy>=6.1",
    "numpy>=2.1",
    "openvino>=2025.1",
    "pillow>=11.0",
    # open_clip's pre-tokenizer pattern needs \p{L}/\p{N} classes.
    "regex>=2024.11.6",
    # Only CLIPTokenizerFast (BPE) is used. <5 because v5 reworks the
    # tokenizer classes; bump once verified against export_ir.py's parity check.
    "transformers>=4.48,<5",
    "uvicorn>=0.34",
]

[dependency-groups]
# Only needed for the one-time IR export (scripts/export_ir.py); torch never
# ships in the service image.
export = [
    "open-clip-torch>=3.2",
    "timm>=1.0.20",
    "torch>=2.6",
    # Pulled in by open_clip; pinned to the CPU index alongside torch so the
    # two wheels are ABI-compatible.
    "torchvision>=0.21",
]
dev = [
    "pytest>=8.3",
]

[tool.uv]
# An application, not an installable package: `uv sync` manages deps only.
package = false
default-groups = []

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
